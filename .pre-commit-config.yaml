repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Go hooks using the toolchain already on PATH, so there is nothing extra to install.
  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        description: Format Go code
        entry: go fmt ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-vet
        name: go vet
        description: Check Go code for correctness
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-mod-tidy
        name: go mod tidy
        description: Tidy Go modules
        entry: go mod tidy
        language: system
        pass_filenames: false

      - id: golangci-lint
        name: run golangci-lint
        description: Lint Go code
        entry: golangci-lint run --fix ./...
        language: system
        types: [go]
        pass_filenames: false
