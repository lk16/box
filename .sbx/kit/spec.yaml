# box's own kit, not a template: it is built around this repository's mounted Go toolchain, so a
# project that copies it gets a sandbox where every dependency download 403s. `box gen` writes a
# starter policy at .box/kit/spec.yaml -- begin there instead.
schemaVersion: "2"
kind: mixin
name: box-network-policy
displayName: box network policy
description: The agent's own API calls and nothing else; box depends on the standard library alone

permissions:
  network:
    allow:
      - api.anthropic.com:443   # the agent's own API calls (not auto-included by the claude kit)
      # Nothing else is allowlisted, and the checks still run: box imports only the standard
      # library, so `go build` and `go test` need nothing from the network. proxy.golang.org is
      # deliberately absent -- if a build here wants it, a dependency crept in, which
      # docs/goal.md says must not happen.

setup:
  startup:
    - command: ["sudo", "rm", "-f", "/usr/local/bin/clipboard-bridge", "/usr/local/bin/sbx-clipboard"]
      description: Remove the clipboard bridge binaries (no documented off-switch exists)
    - command:
        - "sh"
        - "-c"
        - |
          # A mount keeps the path it has on the host, which differs per machine, so find the
          # toolchain by what it contains rather than by where anyone happens to keep it. The
          # image ships its own Go, which may be older than go.mod asks for, so the host's wins.
          for mount in $(grep " virtiofs " /proc/mounts | cut -d" " -f2); do
            if [ -x "$mount/bin/go" ] && [ ! -e /usr/local/bin/go.host ]; then
              sudo ln -sf "$mount/bin/go" /usr/local/bin/go
              sudo touch /usr/local/bin/go.host
            fi
          done
      description: >-
        Put the host's Go toolchain first on PATH, so the sandbox builds with
        the version go.mod asks for rather than whatever the image ships. With
        no proxy.golang.org on the allowlist there is no way to download one,
        and golangci-lint is mounted or absent for the same reason.
