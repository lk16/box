name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # box has no dependencies, so there is no go.sum and nothing to cache.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Tidy
        run: go mod tidy && git diff --exit-code go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9

      - name: Tests
        run: go test ./...

  # Every merge into main that passes the checks is the next minor release. See docs/updates.md.
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            echo "HEAD is not a merge, so there is nothing to release"
            exit 0
          fi
          if [ -n "$(git tag --points-at HEAD)" ]; then
            echo "HEAD is already released"
            exit 0
          fi
          last=$(git describe --tags --abbrev=0 --match 'v0.*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            next=v0.1.0
            notes="- First numbered release"
          else
            next="v0.$(( $(echo "$last" | cut -d. -f2) + 1 )).0"
            notes=$(git log "$last..HEAD" --no-merges --format='- %s')
          fi
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$next" -o "dist/box-${target%/*}-${target#*/}" ./cmd/box
          done
          (cd dist && sha256sum box-* > SHA256SUMS)
          gh release create "$next" dist/* --target "$GITHUB_SHA" --title "$next" --notes "$notes"
          # The proxy learns of a tag when first asked, so ask now rather than when a user does.
          curl -fsS "https://proxy.golang.org/github.com/lk16/box/@v/$next.info" || true
